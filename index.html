<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <style>
      html { background: #fff; }
      html.dark { background: oklch(0.145 0 0); }
      body { margin: 0; }
   </style>
   <script>
      try {
         const theme = localStorage.getItem('theme') ?? 'dark';
         const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
         document.documentElement.classList.toggle('dark', dark);
      } catch {
         document.documentElement.classList.add('dark');
      }
   </script>
   <link rel="preload" as="image" href="/landing/charge-sculpture-light.webp" type="image/webp" fetchpriority="high" />
   <link rel="preload" as="image" href="/landing/charge-sculpture-dark.webp" type="image/webp" fetchpriority="high" />
   <title>StudySprint — Focus in. Charge up.</title>
   <meta name="description" content="Plan study goals, import your syllabus, and focus with Pomodoro or stopwatch sessions. Build study charge and XP, then understand your progress with analytics." />
   <link rel="icon" type="image/svg+xml" href="/logo.svg" />
   <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

   <!-- Open Graph -->
   <meta property="og:title" content="StudySprint — Focus in. Charge up." />
   <meta property="og:description" content="Plan study goals, import your syllabus, and focus with Pomodoro or stopwatch sessions. Build study charge and XP, then understand your progress with analytics." />
   <meta property="og:image" content="https://getstudysprint.vercel.app/social-card.png" />
   <meta property="og:url" content="https://getstudysprint.vercel.app" />
   <meta property="og:type" content="website" />

   <!-- Twitter Card -->
   <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
   <div id="root"></div>
   <script type="module" src="/frontend/main.tsx"></script>
</body>

</html>
