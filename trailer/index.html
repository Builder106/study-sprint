<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    @font-face {
      font-family: "Inter";
      src: url("public/fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("public/fonts/JetBrainsMono.ttf") format("truetype");
      font-weight: 100 800;
    }
  </style>
</head>
<body style="margin:0;">
  <div id="stage" data-composition-id="ClosedCircuit" data-width="1920" data-height="1080" data-fps="30" data-start="0" data-duration="50">
    <video id="board" class="clip" src="public/board.mp4" muted playsinline data-start="0" data-duration="50" data-track-index="0"></video>
    <div id="overlay" class="clip" data-start="0" data-duration="50" data-track-index="1"></div>
    <audio id="soundtrack" src="public/soundtrack.mp3" data-start="0" data-duration="50" data-track-index="10"></audio>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines.ClosedCircuit = gsap.timeline({ paused: true });
  </script>
  <script type="module">
    import { buildComposition } from "./js/composition.js";
    buildComposition(document.getElementById("stage"), window.__timelines.ClosedCircuit);
  </script>
</body>
</html>
