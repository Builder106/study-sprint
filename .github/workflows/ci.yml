name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when a new commit lands on the same branch — keeps the
# E2E job from racing itself against the shared Supabase demo account.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task lint

  typecheck:
    name: Typecheck & Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Open-source license compliance scan
        run: deno run -A npm:license-checker --summary
      - name: Install deps
        run: deno install --allow-scripts=npm:@tailwindcss/oxide
      - name: TypeScript typecheck
        run: deno task check

  build:
    name: Build & Bundle Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build
        # Vite inlines VITE_* values at build time. CI builds with placeholders
        # so we can verify "is this buildable?" without exposing real keys to
        # PR forks. The deployed bundle is built locally with real .env values
        # via `vercel --prod --yes`.
        run: deno run -A npm:vite build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      - name: Verify bundle size budget
        run: |
          echo "=== Production bundle assets ==="
          ls -lh dist/
          TOTAL_KB=$(du -sk dist | cut -f1)
          echo "Total bundle size: ${TOTAL_KB} KB"
          if [ "$TOTAL_KB" -gt 15000 ]; then
            echo "Bundle size exceeded 15MB budget ceiling: ${TOTAL_KB} KB"
            exit 1
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task test:unit

  # E2E only runs on push to main (not on every PR push). The suite hits the
  # real Supabase project — running it from PR CI would race against local dev
  # on the shared demo account and burn through Supabase's signup rate limit.
  # continue-on-error: true — retained as a soft gate; the native Deno Playwright runner (deno run -A npm:@playwright/test/cli.js) avoids the old npx→Deno wrapper hang on ubuntu-latest.
  e2e:
    name: E2E & Accessibility
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, lint, typecheck, build, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: deno run -A npm:playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      - name: Bootstrap demo account
        run: deno task test:setup
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Install dependencies
        run: deno install
      - name: Generate BDD tests
        run: deno run -A npm:playwright-bdd/bddgen --config=playwright.config.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      - name: Run E2E suite
        run: deno run -A npm:@playwright/test/playwright test --config=playwright.config.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy to Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, lint, typecheck, build, unit]
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      VERCEL_ORG_ID: team_QBH0412lFDlXgxDpQuY75YAp
      VERCEL_PROJECT_ID: prj_45WW8wwWB3Q3DtJPCpaktowmI66l
    steps:
      - uses: actions/checkout@v7
      - name: Pull project settings
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
